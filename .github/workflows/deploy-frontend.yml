name: Deploy frontend and backend

# web/ is this repository's frontend directory.
# FRONTEND_SSH_PORT is the SSH port (9103), not the HTTP service port.
# FRONTEND_DEPLOY_COMMAND must restart both services on this target server.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'dev_frontend.py'
      - 'deploy/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy-frontend.yml'
      - '.github/workflows/deploy-ssh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-ssh.yml
    with:
      target: frontend-and-backend
      deploy-path: ${{ vars.FRONTEND_DEPLOY_PATH }}
      deploy-command: ${{ vars.FRONTEND_DEPLOY_COMMAND }}
    secrets:
      SSH_HOST: ${{ secrets.FRONTEND_SSH_HOST }}
      SSH_PORT: ${{ secrets.FRONTEND_SSH_PORT }}
      SSH_USERNAME: ${{ secrets.FRONTEND_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.FRONTEND_SSH_PASSWORD }}
      SSH_KNOWN_HOSTS: ${{ secrets.FRONTEND_SSH_KNOWN_HOSTS }}
